<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="scaffolded-by" content="https://github.com/schultek/jaspr">

        <title>Finch — Online Store</title>
        <script>
            (function() {
                var p = window.location.pathname;
                var isSubpath = (window.location.hostname.indexOf('sparrow-x.in') !== -1) && p.startsWith('/store');
                var base = isSubpath ? '/store/' : '/';
                document.write('<base href="' + base + '">');
            })();
        </script>

        <!-- Favicons -->
        <link rel="icon" type="image/x-icon" href="favicon.ico">
        <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
        <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

        <!-- Google Fonts: Dancing Script & Manrope -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700;800;900&family=Playball&family=Arizonia&display=swap">

        <!-- PhonePe Checkout JS Bundle -->
        <script src="https://mercury.phonepe.com/web/bundle/checkout.js" defer></script>
        <!-- QRCode.js bundle for instant 0ms client-side QR generation -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
        <script>
            window.phonePeTransact = function(tokenUrl, type, callback) {
                if (window.PhonePeCheckout && window.PhonePeCheckout.transact) {
                    window.PhonePeCheckout.transact({ tokenUrl: tokenUrl, callback: callback, type: type || 'IFRAME' });
                } else {
                    console.error('PhonePeCheckout SDK is not loaded yet');
                }
            };
            window.renderQrCode = function(elementId, text, size) {
                let attempts = 0;
                function render() {
                    attempts++;
                    const el = document.getElementById(elementId);
                    if (!el || typeof QRCode === 'undefined') {
                        if (attempts < 50) {
                            setTimeout(render, 30);
                        }
                        return;
                    }
                    el.innerHTML = '';
                    new QRCode(el, {
                        text: text,
                        width: size || 190,
                        height: size || 190,
                        correctLevel: QRCode.CorrectLevel.M
                    });
                }
                render();
            };
        </script>

        <!-- Loads the generated CSS file -->
        <link rel="stylesheet" href="styles.css">

        <!-- Global CSS to completely remove all scrollbars -->
        <style>
            * {
                -ms-overflow-style: none !important;
                scrollbar-width: none !important;
            }
            *::-webkit-scrollbar {
                display: none !important;
                width: 0 !important;
                height: 0 !important;
                background: transparent !important;
            }
        </style>

        <!-- Loads and runs the compiled 'main.client.dart' file -->
        <script defer src="main.client.dart.js"></script>
    </head>
    <body class="bg-neutral text-neutral-content font-sans antialiased min-h-screen">
    </body>
</html>
