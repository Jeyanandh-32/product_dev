name: Deploy Sparrow POS to AWS EC2

on:
  push:
    branches: [ main, stage ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      merchant: ${{ steps.filter.outputs.merchant }}
      customer: ${{ steps.filter.outputs.customer }}
      terminal: ${{ steps.filter.outputs.terminal }}
      landing: ${{ steps.filter.outputs.landing }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'packages/**'
            merchant:
              - 'merchant/**'
              - 'packages/**'
            customer:
              - 'customer/**'
              - 'packages/**'
            terminal:
              - 'terminal/**'
              - 'packages/**'
            landing:
              - 'landing/**'
            migrations:
              - 'backend/migrations/**'

  build:
    name: Build & Package Changes
    needs: changes
    runs-on: ubuntu-latest
    env:
      API_DOMAIN: ${{ github.ref == 'refs/heads/stage' && 'pos-stage.sparrow-x.in' || 'pos.sparrow-x.in' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter & Dart SDK
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.merchant == 'true' || needs.changes.outputs.customer == 'true' || needs.changes.outputs.terminal == 'true' || github.event_name == 'workflow_dispatch'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Workspace Dependencies
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.merchant == 'true' || needs.changes.outputs.customer == 'true' || needs.changes.outputs.terminal == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          dart pub global activate melos
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          melos bootstrap

      - name: Run Tests on Changed Packages
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.customer == 'true' || needs.changes.outputs.terminal == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          dart analyze
          if [ "${{ needs.changes.outputs.backend }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            cd backend && dart test && cd ..
          fi
          if [ "${{ needs.changes.outputs.customer }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            cd customer && dart test && cd ..
          fi
          if [ "${{ needs.changes.outputs.terminal }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            cd terminal && flutter test && cd ..
          fi

      - name: Build Merchant Web App (WASM)
        if: needs.changes.outputs.merchant == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          cd merchant
          dart pub global activate jaspr_cli
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          jaspr build --experimental-wasm

      - name: Build Customer Store Web App (WASM)
        if: needs.changes.outputs.customer == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          cd customer
          dart pub global activate jaspr_cli
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          jaspr build --experimental-wasm

      - name: Build & Compile Native Backend Binary
        if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          dart pub global activate dart_frog_cli
          cd backend
          dart pub global run dart_frog_cli:dart_frog build
          mv build /tmp/backend-build
          cd /tmp/backend-build
          dart pub get
          dart compile exe bin/server.dart -o $GITHUB_WORKSPACE/server.exe

      - name: Package Changed Artifacts
        run: |
          mkdir -p dist
          if [ -d "merchant/build/jaspr" ]; then
            mkdir -p dist/merchant
            cp -r merchant/build/jaspr/* dist/merchant/
          fi
          if [ -d "customer/build/jaspr" ]; then
            mkdir -p dist/store
            cp -r customer/build/jaspr/* dist/store/
          fi
          if [ "${{ needs.changes.outputs.landing }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mkdir -p dist/landing
            cp -r landing/* dist/landing/
          fi
          if [ "${{ needs.changes.outputs.migrations }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mkdir -p dist/migrations
            cp -r backend/migrations/* dist/migrations/
          fi
          if [ -f "server.exe" ]; then
            cp server.exe dist/
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/

  deploy:
    name: Deploy to EC2
    needs: [changes, build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stage'
    env:
      TARGET_WEB_DIR: ${{ github.ref == 'refs/heads/stage' && '/var/www/pos/stage' || '/var/www/pos/main' }}
      TARGET_APP_DIR: ${{ github.ref == 'refs/heads/stage' && 'pos/stage' || 'pos/main' }}
      TARGET_SERVICE: ${{ github.ref == 'refs/heads/stage' && 'pos-stage-backend' || 'pos-backend' }}

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Selective Artifacts via Rsync
        run: |
          if [ -d "dist/landing" ]; then
            rsync -avz -e "ssh -i ~/.ssh/id_rsa" dist/landing/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ env.TARGET_WEB_DIR }}/landing/
          fi
          if [ -d "dist/merchant" ]; then
            rsync -avz -e "ssh -i ~/.ssh/id_rsa" dist/merchant/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ env.TARGET_WEB_DIR }}/merchant/
          fi
          if [ -d "dist/store" ]; then
            rsync -avz -e "ssh -i ~/.ssh/id_rsa" dist/store/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ env.TARGET_WEB_DIR }}/store/
          fi
          if [ -d "dist/migrations" ]; then
            rsync -avz -e "ssh -i ~/.ssh/id_rsa" dist/migrations/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/${{ env.TARGET_APP_DIR }}/migrations/
          fi
          if [ -f "dist/server.exe" ]; then
            rsync -avz -e "ssh -i ~/.ssh/id_rsa" dist/server.exe ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/${{ env.TARGET_APP_DIR }}/server.exe
          fi

      - name: Restart Backend Service
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.migrations == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            if [ -f "/home/${{ secrets.EC2_USER }}/${{ env.TARGET_APP_DIR }}/server.exe" ]; then
              chmod +x /home/${{ secrets.EC2_USER }}/${{ env.TARGET_APP_DIR }}/server.exe
              sudo systemctl restart ${{ env.TARGET_SERVICE }}
            fi
          EOF

