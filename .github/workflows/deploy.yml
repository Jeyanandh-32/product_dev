name: Deploy Finch POS to AWS EC2

on:
  push:
    branches: [ main, stage ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write   # needed for AWS OIDC auth
  contents: read

env:
  AWS_REGION: <us-east-1>
  SSM_PREFIX: /finch/${{ github.ref_name }}

jobs:
  # ─────────────────────────────────────────────
  # 1. Detect changes since each component's last SUCCESSFUL deploy
  # ─────────────────────────────────────────────
  changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      merchant: ${{ steps.filter.outputs.merchant }}
      customer: ${{ steps.filter.outputs.customer }}
      terminal: ${{ steps.filter.outputs.terminal }}
      landing: ${{ steps.filter.outputs.landing }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: <arn:aws:iam::ACCOUNT_ID:role/github-actions-deploy-role>
          aws-region: ${{ env.AWS_REGION }}

      - name: Get last successful deploy SHA per component
        id: last_sha
        run: |
          ROOT_SHA=$(git rev-list --max-parents=0 HEAD)
          for comp in backend merchant customer terminal landing migrations; do
            SHA=$(aws ssm get-parameter \
              --name "${SSM_PREFIX}/${comp}/last-deploy-sha" \
              --query 'Parameter.Value' --output text 2>/dev/null || echo "")
            if [ -z "$SHA" ] || [ "$SHA" == "None" ] || ! git cat-file -e "$SHA" 2>/dev/null; then
              SHA="$ROOT_SHA"
            fi
            echo "Resolved base for $comp: $SHA"
            echo "${comp}_sha=$SHA" >> "$GITHUB_OUTPUT"
          done

      - name: Detect changes per component
        id: filter
        run: |
          check() {
            local name=$1 sha=$2; shift 2
            local paths=("$@")
            if ! git diff --quiet "$sha" HEAD -- "${paths[@]}"; then
              echo "${name}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${name}=false" >> "$GITHUB_OUTPUT"
            fi
          }

          check backend    "${{ steps.last_sha.outputs.backend_sha }}"    'backend' ':!backend/migrations'
          check merchant   "${{ steps.last_sha.outputs.merchant_sha }}"   'merchant'
          check customer   "${{ steps.last_sha.outputs.customer_sha }}"   'customer'
          check terminal   "${{ steps.last_sha.outputs.terminal_sha }}"   'terminal'
          check landing    "${{ steps.last_sha.outputs.landing_sha }}"    'landing'
          check migrations "${{ steps.last_sha.outputs.migrations_sha }}" 'backend/migrations'

  # ─────────────────────────────────────────────
  # 2. Deploy jobs — one per component
  #    Each only writes its SSM success-marker if deploy succeeds
  # ─────────────────────────────────────────────
  deploy-migrations:
    name: Run DB Migrations
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: <arn:aws:iam::ACCOUNT_ID:role/github-actions-deploy-role>
          aws-region: ${{ env.AWS_REGION }}
      - name: Run migrations on EC2
        run: |
          aws ssm send-command \
            --instance-ids "<i-xxxxxxxxxxxxxxxxx>" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /opt/finch/backend && ./run-migrations.sh"]' \
            --comment "Finch migrations - ${{ github.sha }}" \
            --output text
      - name: Mark migrations deploy successful
        if: success()
        run: |
          aws ssm put-parameter \
            --name "${SSM_PREFIX}/migrations/last-deploy-sha" \
            --value "${{ github.sha }}" \
            --type String --overwrite

  deploy-backend:
    name: Deploy Backend
    needs: [changes, deploy-migrations]
    if: |
      always() &&
      needs.changes.outputs.backend == 'true' &&
      (needs.deploy-migrations.result == 'success' || needs.deploy-migrations.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: <arn:aws:iam::ACCOUNT_ID:role/github-actions-deploy-role>
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy backend to EC2
        run: |
          aws ssm send-command \
            --instance-ids "<i-xxxxxxxxxxxxxxxxx>" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /opt/finch/backend && git fetch && git checkout ${{ github.sha }} && ./deploy.sh"]' \
            --comment "Finch backend - ${{ github.sha }}" \
            --output text
      - name: Mark backend deploy successful
        if: success()
        run: |
          aws ssm put-parameter \
            --name "${SSM_PREFIX}/backend/last-deploy-sha" \
            --value "${{ github.sha }}" \
            --type String --overwrite

  deploy-merchant:
    name: Deploy Merchant App
    needs: [changes, deploy-backend]
    if: |
      always() &&
      needs.changes.outputs.merchant == 'true' &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: <arn:aws:iam::ACCOUNT_ID:role/github-actions-deploy-role>
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy merchant to EC2
        run: |
          aws ssm send-command \
            --instance-ids "<i-xxxxxxxxxxxxxxxxx>" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /opt/finch/merchant && git fetch && git checkout ${{ github.sha }} && ./deploy.sh"]' \
            --comment "Finch merchant - ${{ github.sha }}" \
            --output text
      - name: Mark merchant deploy successful
        if: success()
        run: |
          aws ssm put-parameter \
            --name "${SSM_PREFIX}/merchant/last-deploy-sha" \
            --value "${{ github.sha }}" \
            --type String --overwrite

  deploy-customer:
    name: Deploy Customer App
    needs: [changes, deploy-backend]
    if: |
      always() &&
      needs.changes.outputs.customer == 'true' &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: <arn:aws:iam::ACCOUNT_ID:role/github-actions-deploy-role>
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy customer to EC2
        run: |
          aws ssm send-command \
            --instance-ids "<i-xxxxxxxxxxxxxxxxx>" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /opt/finch/customer && git fetch && git checkout ${{ github.sha }} && ./deploy.sh"]' \
            --comment "Finch customer - ${{ github.sha }}" \
            --output text
      - name: Mark customer deploy successful
        if: success()
        run: |
          aws ssm put-parameter \
            --name "${SSM_PREFIX}/customer/last-deploy-sha" \
            --value "${{ github.sha }}" \
            --type String --overwrite

  deploy-terminal:
    name: Deploy Terminal App
    needs: [changes, deploy-backend]
    if: |
      always() &&
      needs.changes.outputs.terminal == 'true' &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: <arn:aws:iam::ACCOUNT_ID:role/github-actions-deploy-role>
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy terminal to EC2
        run: |
          aws ssm send-command \
            --instance-ids "<i-xxxxxxxxxxxxxxxxx>" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /opt/finch/terminal && git fetch && git checkout ${{ github.sha }} && ./deploy.sh"]' \
            --comment "Finch terminal - ${{ github.sha }}" \
            --output text
      - name: Mark terminal deploy successful
        if: success()
        run: |
          aws ssm put-parameter \
            --name "${SSM_PREFIX}/terminal/last-deploy-sha" \
            --value "${{ github.sha }}" \
            --type String --overwrite

  deploy-landing:
    name: Deploy Landing Site
    needs: changes
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: <arn:aws:iam::ACCOUNT_ID:role/github-actions-deploy-role>
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy landing to EC2
        run: |
          aws ssm send-command \
            --instance-ids "<i-xxxxxxxxxxxxxxxxx>" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /opt/finch/landing && git fetch && git checkout ${{ github.sha }} && ./deploy.sh"]' \
            --comment "Finch landing - ${{ github.sha }}" \
            --output text
      - name: Mark landing deploy successful
        if: success()
        run: |
          aws ssm put-parameter \
            --name "${SSM_PREFIX}/landing/last-deploy-sha" \
            --value "${{ github.sha }}" \
            --type String --overwrite
