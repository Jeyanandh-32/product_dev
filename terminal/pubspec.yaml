name: terminal
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  models:
    path: ../packages/models
  validators:
    path: ../packages/validators
  api_client:
    path: ../packages/api_client
  client_repositories:
