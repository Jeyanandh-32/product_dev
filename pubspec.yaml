name: product_dev
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - packages/models
  - packages/validators
  - packages/api_client
  - packages/client_repositories
  - backend
  - merchant
  - terminal
  - customer

dev_dependencies:
  args: ^2.5.0
  melos: ^8.3.0
  path: ^1.9.0
  test: ^1.25.0

melos:
  scripts:
    analyze:
      run: melos exec --concurrency=1 -- "dart analyze"
      description: Run dart analyze across all packages.

    test:dart:
      run: melos exec --dir-exists="test" --depends-on="test" -- "dart test"
      description: Run unit tests for Dart packages/backend.

    test:flutter:
      run: melos exec --dir-exists="test" --depends-on="flutter_test" -- "flutter test"
      description: Run unit/widget tests for Flutter terminal app.

    clean:
      run: melos exec -- "flutter clean || true"
      description: Clean build caches.

    format:
      run: melos exec -- "dart format ."
      description: Format Dart code across all packages.
