<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="scaffolded-by" content="https://github.com/schultek/jaspr">

        <base id="app-base" href="/">
        <title>Finch POS — Merchant</title>
        <script>
            (function() {
                var p = window.location.pathname;
                var base = p.startsWith('/merchant') ? '/merchant/' : '/';
                var b = document.getElementById('app-base');
                if (b) b.setAttribute('href', base);
            })();
        </script>

        <!-- Google Fonts: Arizonia & Manrope -->
        <!-- Favicons -->
        <link rel="icon" type="image/x-icon" href="favicon.ico">
        <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
        <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

        <!-- Google Fonts: Plus Jakarta Sans -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700;800;900&family=Playball&family=Arizonia&display=swap">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap">

        <!-- Loads Cally web component module for daisyUI calendar -->
        <script type="module" src="https://unpkg.com/cally"></script>

        <!-- Loads the generated CSS file. -->
        <link rel="stylesheet" href="styles.css">

        <!-- Loads Chart.js library -->
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


        <!-- PhonePe Checkout JS Bundle -->
        <script src="https://mercury.phonepe.com/web/bundle/checkout.js" defer></script>
        <script>
            window.phonePeTransact = function(tokenUrl, type, callback) {
                if (window.PhonePeCheckout && window.PhonePeCheckout.transact) {
                    window.PhonePeCheckout.transact({ tokenUrl: tokenUrl, callback: callback, type: type || 'IFRAME' });
                } else {
                    console.error('PhonePeCheckout SDK is not loaded yet');
                }
            };
        </script>

        <!-- Loads and runs the compiled 'main.client.dart' file. -->
        <script defer src="main.client.dart.js"></script>

        <!-- Chart.js initialization helper for JS Interop -->
        <script>
            window._charts = window._charts || {};
            window.renderChart = function(canvasId, type, data, options, retries) {
                const ctx = document.getElementById(canvasId);
                if (!ctx) {
                    retries = retries || 0;
                    if (retries < 35) {
                        setTimeout(function() {
                            window.renderChart(canvasId, type, data, options, retries + 1);
                        }, 30);
                    }
                    return null;
                }

                options = options || {};

                if (options.centerHoverLabels) {
                    const centerConfig = options.centerHoverLabels;
                    delete options.centerHoverLabels;

                    options.onHover = function(event, chartElement) {
                        const labelEl = document.getElementById(centerConfig.labelId);
                        const valueEl = document.getElementById(centerConfig.valueId);
                        if (!labelEl || !valueEl) return;

                        if (chartElement && chartElement.length > 0) {
                            const idx = chartElement[0].index;
                            const item = centerConfig.items[idx];
                            if (item) {
                                labelEl.textContent = item.label;
                                valueEl.textContent = item.value;
                            }
                        } else {
                            labelEl.textContent = centerConfig.defaultLabel;
                            valueEl.textContent = centerConfig.defaultValue;
                        }
                    };
                }

                const existingChart = window._charts[canvasId];
                if (existingChart) {
                    try { existingChart.destroy(); } catch(e) {}
                    delete window._charts[canvasId];
                }

                const chart = new Chart(ctx, {
                    type: type,
                    data: data,
                    options: options
                });

                window._charts[canvasId] = chart;
                return chart;
            };

            window.addEventListener('resize', function() {
                for (const key in window._charts) {
                    if (window._charts[key]) {
                        try { window._charts[key].resize(); } catch(e) {}
                    }
                }
            });
        </script>





        <!-- Automatically closes open details dropdowns when clicking outside -->
        <script>
            document.addEventListener('click', function(e) {
                document.querySelectorAll('details[open]').forEach(function(details) {
                    if (!details.contains(e.target)) {
                        details.removeAttribute('open');
                    }
                });
            });
        </script>
    </head>
    <body>
        <!-- Your app component will be inserted here. -->
    </body>
</html>
