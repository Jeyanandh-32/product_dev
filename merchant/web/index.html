<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="scaffolded-by" content="https://github.com/schultek/jaspr">

        <title>merchant</title>
        <base href="/merchant/">

        <!-- Google Fonts: Arizonia & Manrope -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arizonia&family=Manrope:wght@300;400;500;600;700;800&display=swap">

        <!-- Loads Cally web component module for daisyUI calendar -->
        <script type="module" src="https://unpkg.com/cally"></script>

        <!-- Loads the generated CSS file. -->
        <link rel="stylesheet" href="styles.css">

        <!-- Loads Chart.js library -->
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


        <!-- Loads and runs the compiled 'main.client.dart' file. -->
        <script defer src="main.client.dart.js"></script>

        <!-- Chart.js initialization helper for JS Interop -->
        <script>
            window._charts = window._charts || {};
            window.renderChart = function(canvasId, type, data, options, retries) {
                const ctx = document.getElementById(canvasId);
                if (!ctx) {
                    retries = retries || 0;
                    if (retries < 20) {
                        setTimeout(function() {
                            window.renderChart(canvasId, type, data, options, retries + 1);
                        }, 16);
                    }
                    return null;
                }

                options = options || {};

                if (options.centerHoverLabels) {
                    const centerConfig = options.centerHoverLabels;
                    delete options.centerHoverLabels;

                    options.onHover = function(event, chartElement) {
                        const labelEl = document.getElementById(centerConfig.labelId);
                        const valueEl = document.getElementById(centerConfig.valueId);
                        if (!labelEl || !valueEl) return;

                        if (chartElement && chartElement.length > 0) {
                            const idx = chartElement[0].index;
                            const item = centerConfig.items[idx];
                            if (item) {
                                labelEl.textContent = item.label;
                                valueEl.textContent = item.value;
                            }
                        } else {
                            labelEl.textContent = centerConfig.defaultLabel;
                            valueEl.textContent = centerConfig.defaultValue;
                        }
                    };
                }

                const existingChart = window._charts[canvasId];
                if (existingChart) {
                    try { existingChart.destroy(); } catch(e) {}
                    delete window._charts[canvasId];
                }

                const chart = new Chart(ctx, {
                    type: type,
                    data: data,
                    options: options
                });

                window._charts[canvasId] = chart;
                return chart;
            };
        </script>





        <!-- Automatically closes open details dropdowns when clicking outside -->
        <script>
            document.addEventListener('click', function(e) {
                document.querySelectorAll('details[open]').forEach(function(details) {
                    if (!details.contains(e.target)) {
                        details.removeAttribute('open');
                    }
                });
            });
        </script>
    </head>

    </body>
</html>
